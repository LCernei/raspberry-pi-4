name: mpd

services:
  mpd:
    image: giof71/mpd-alsa
    container_name: mpd
    devices:
      - /dev/snd
    ports:
      - "6600:6600"
    environment:
      ALSA_OUTPUT_CREATE: "yes"
      ALSA_OUTPUT_ENABLED: "yes"
      USER_MODE: "yes"
      AUDIO_GID: "29"
    volumes:
      - ${HOME:?HOME must be configured}/containers/mpd/music:/music:ro
      - ${HOME:?HOME must be configured}/containers/mpd/playlists:/playlists
      - ${HOME:?HOME must be configured}/containers/mpd/db:/db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
