name: music-assistant

services:
  music-assistant:
    image: ghcr.io/music-assistant/server:latest
    container_name: music-assistant
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    volumes:
      - ${HOME:?HOME must be configured}/containers/music-assistant/data:/data/
    environment:
      LOG_LEVEL: info
