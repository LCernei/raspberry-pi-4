name: arcane

services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: arcane
    ports:
      - "3552:3552"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME:?HOME must be configured}/containers/arcane:/app/data
      - ${HOME:?HOME must be configured}/gitops:/projects
    environment:
      - APP_URL
      - PUID=1000
      - PGID=1000
      - ENCRYPTION_KEY
      - PROJECTS_DIRECTORY=/projects
    cgroup: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
