name: newt

services:
  newt:
    image: fosrl/newt:latest
    container_name: newt
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_add:
      - NET_ADMIN
    environment:
      - PANGOLIN_ENDPOINT
      - NEWT_ID
      - NEWT_SECRET
    networks:
      - default
      - mympd

networks:
  mympd:
    external: true
    name: mympd_default
