name: mympd

services:
  mympd:
    image: ghcr.io/jcorporation/mympd/mympd
    container_name: mympd
    ports:
      - "80:8080"
    user: "1000:1000"
    environment:
      UMASK_SET: "022"
      MYMPD_SSL: "false"
      MYMPD_HTTP_PORT: "8080"
    volumes:
      - ${HOME:?HOME must be configured}/containers/mympd/workdir:/var/lib/mympd
      - ${HOME:?HOME must be configured}/containers/mympd/cachedir:/var/cache/mympd
      - ${HOME:?HOME must be configured}/containers/mpd/music:/var/lib/mpd/music:ro
      - ${HOME:?HOME must be configured}/containers/mpd/playlists:/var/lib/mpd/playlists:ro
    networks:
      - default
      - mpd
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mpd:
    external: true
    name: mpd_default
